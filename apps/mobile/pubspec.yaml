name: mobile
description: "A movie discovery and watchlist app built with Flutter and Firebase."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: "^3.11.1"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^17.2.2
  # Firebase Core
  firebase_core: ^3.3.0                
  # Firebase Authentication
  firebase_auth: ^5.2.0  
  cloud_firestore: ^5.2.0  

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:

  uses-material-design: true


